name: rust
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA and WebKitGTK headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  opencv:
    # Best effort. Distribution OpenCV versions are not pinned, so a failure
    # here is reported without failing the workflow.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: opencv
      - name: Install OpenCV and libclang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev clang libclang-dev libasound2-dev pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - name: Install OpenCV
        if: runner.os == 'macOS'
        run: brew install opencv pkgconf
      - run: cargo clippy -p shottrainer-tracking --features opencv --all-targets -- -D warnings
      - run: cargo test -p shottrainer-tracking --features opencv
      - run: cargo clippy -p shottrainer-controller --features opencv --all-targets -- -D warnings
      - run: cargo test -p shottrainer-controller --features opencv
      - run: cargo clippy -p shottrainer-app --features opencv --all-targets -- -D warnings
