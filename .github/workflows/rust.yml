name: rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA and WebKitGTK headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  opencv:
    # The Linux leg is required. Homebrew OpenCV is not pinned, so a macOS
    # failure is reported without failing the workflow.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: opencv
      - name: Install OpenCV and libclang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev clang libclang-dev libasound2-dev pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - name: Install OpenCV
        if: runner.os == 'macOS'
        run: brew install opencv pkgconf
      - run: cargo clippy -p shottrainer-tracking --features opencv --all-targets -- -D warnings
      - run: cargo test -p shottrainer-tracking --features opencv
      - run: cargo clippy -p shottrainer-controller --features opencv --all-targets -- -D warnings
      - run: cargo test -p shottrainer-controller --features opencv
      - run: cargo clippy -p shottrainer-app --features opencv --all-targets -- -D warnings
