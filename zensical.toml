# Zensical configuration for the ShotTrainer documentation site.

[project]
site_name = "ShotTrainer"
site_description = "Free, open-source optical shooting trainer for air rifle, air pistol and smallbore practice. Camera-based aim tracking, shot scoring and replay."
site_url = "https://shottrainer.org/"
repo_url = "https://github.com/dsgnr/ShotTrainer"
repo_name = "dsgnr/ShotTrainer"
docs_dir = "docs"
exclude_docs = """
cameras/images/README.md
cameras/template.md
"""

extra_javascript = [
    "assets/mermaid-init.js",
]

extra_css = [
    "stylesheets/site.css",
    "stylesheets/landing.css",
]

nav = [
    { "Home" = "index.md" },
    { "User guide" = [
        "installation.md",
        "getting-started.md",
        "setup.md",
        "sessions.md",
        "replay.md",
        "session-browser.md",
        "stats.md",
        "audio-setup.md",
        "scoring.md",
        "printing-targets.md",
        "preferences.md",
        "shortcuts.md",
        "how-tracking-works.md",
        "accuracy.md",
        "calibration.md",
        "provided-targets.md",
        "troubleshooting.md",
    ] },
    { "Cameras" = [
        "cameras.md",
        { "Camera models" = [
            "cameras/waveshare-ov9281.md",
            "cameras/arducam-ov9281.md",
        ] },
    ] },
    { "Reference" = [
        "architecture.md",
        "engineering-notes.md",
    ] },
    { "Releases" = "releases.md" },
]

[project.theme]
logo = "assets/img/icon.svg"
favicon = "assets/img/icon.ico"
variant = "modern"
custom_dir = "overrides"
features = [
    "navigation.instant",
    "navigation.sections",
    "content.code.copy",
]

# Match the user's system colour scheme.
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "blue"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.toc]
permalink = true
