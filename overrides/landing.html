{% extends "main.html" %}

{% block extrahead %}
  {{ super() }}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ShotTrainer",
      "url": {{ config.site_url | tojson }},
      "image": {{ (config.site_url ~ "assets/img/social.jpg") | tojson }},
      "screenshot": {
        "@type": "ImageObject",
        "url": {{ (config.site_url ~ "assets/img/app.jpg") | tojson }},
        "caption": "ShotTrainer showing a session target, shot list, aim trace and statistics"
      },
      "author": {"@type": "Person", "name": "dsgnr", "url": "https://github.com/dsgnr"},
      "sameAs": [{{ config.repo_url | tojson }}],
      "installUrl": {{ (config.site_url ~ "installation/") | tojson }},
      "softwareHelp": {{ (config.site_url ~ "getting-started/") | tojson }},
      "inLanguage": "en-GB",
      "description": {{ page.meta.description | tojson }},
      "applicationCategory": "SportsApplication",
      "operatingSystem": "Windows, macOS, Linux",
      "license": "https://www.gnu.org/licenses/gpl-3.0.html",
      "downloadUrl": "https://github.com/dsgnr/ShotTrainer/releases",
      "isAccessibleForFree": true,
      "offers": {"@type": "Offer", "price": "0", "priceCurrency": "GBP"}
    }
  </script>
{% endblock %}

{% block container %}
  <div class="md-content md-content--landing" data-md-component="content">
    <article class="md-typeset st-landing-article">
      {{ page.content }}
    </article>
  </div>
{% endblock %}
