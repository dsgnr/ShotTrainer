name: Feature request
description: Suggest a feature or improvement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation rather than a solution. The design is worked out in the issue discussion.
    validations:
      required: true
  - type: textarea
    id: ideal
    attributes:
      label: What would the ideal experience look like?
      description: Optional. If you've already got an idea for the UI or workflow, sketch it here.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Optional. Anything you tried that didn't quite fit.
